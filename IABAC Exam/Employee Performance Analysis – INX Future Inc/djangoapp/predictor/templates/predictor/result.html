<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; }
        .result { font-size: 48px; font-weight: bold; color: #007BFF; margin: 20px 0; }
        .back-link { display: inline-block; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        .back-link:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Performance Prediction</h1>
        <p>The predicted performance rating for the employee is:</p>
        <div class="result">{{ result }}</div>
        <a href="{% url 'predict_performance' %}" class="back-link">Predict Another</a>
    </div>
</body>
</html>
